# Fabrique l'APK automatiquement à chaque modification, et le publie dans « Releases »
# pour pouvoir le télécharger directement depuis le téléphone.
name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LanterneD20.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lanterne d20 (version ${{ github.run_number }})
          body: Touche « LanterneD20.apk » ci-dessous pour télécharger l'app, puis ouvre le fichier pour l'installer.
          files: LanterneD20.apk
